<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ANDIE — A Non-Destructive Image Editor</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #0d1117;
        color: #e6edf3;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        text-align: center;
        padding: 2rem 1rem 1rem;
      }

      header h1 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      header p {
        color: #8b949e;
        font-size: 1rem;
        max-width: 600px;
      }

      #loading {
        color: #8b949e;
        font-size: 0.9rem;
        padding: 1rem;
      }

      #loading.hidden {
        display: none;
      }

      .cheerpj-display {
        border: 1px solid #30363d;
        border-radius: 8px;
        overflow: hidden;
        margin: 1rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }

      footer {
        padding: 2rem 1rem;
        color: #8b949e;
        font-size: 0.85rem;
        text-align: center;
      }

      footer a {
        color: #58a6ff;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ANDIE</h1>
      <p>
        A Non-Destructive Image Editor built in Java, running in your browser.
        Open an image and try the filters, transformations, and drawing tools.
      </p>
    </header>

    <div id="loading">Loading Java runtime — this may take a moment...</div>

    <script>
      (async function () {
        await cheerpjInit();
        cheerpjCreateDisplay(900, 650, document.body);
        document.getElementById("loading").classList.add("hidden");
        await cheerpjRunJar("/app/Andie/andie.jar");
      })();
    </script>

    <footer>
      <a href="https://github.com/aaaansi/Andie">View source on GitHub</a>
      &nbsp;·&nbsp; Powered by
      <a href="https://cheerpj.com" target="_blank" rel="noopener"
        >CheerpJ</a
      >
    </footer>
  </body>
</html>
